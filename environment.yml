name: unifusion
channels:
  - pytorch3d
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pip=25.0
  - pytorch=2.0.1
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - pytorch-cuda=11.8
  - pytorch3d=0.7.4
  - numpy=1.26.4
  - scipy=1.13.1
  - cmake=3.31
  - ninja
  - cxx-compiler
  - cgal=5.6
  - gmp
  - pip:
      - -r requirements.txt

