<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">UniFusion logo</title>
  <desc id="desc">A luminous U-shaped fusion mark with multiple view trajectories.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111C44"/>
      <stop offset="1" stop-color="#071021"/>
    </linearGradient>
    <linearGradient id="fusion" x1="132" y1="118" x2="388" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32E6FF"/>
      <stop offset="0.52" stop-color="#4385FF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg)"/>
  <path d="M137 137v124c0 79 45 126 119 126s119-47 119-126V137" fill="none" stroke="url(#fusion)" stroke-width="54" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M105 178c-32 22-51 49-51 78s19 56 51 78M407 178c32 22 51 49 51 78s-19 56-51 78" fill="none" stroke="#7DDCFF" stroke-width="13" stroke-linecap="round" opacity=".78"/>
  <circle cx="78" cy="256" r="14" fill="#32E6FF"/>
  <circle cx="434" cy="256" r="14" fill="#A855F7"/>
  <circle cx="256" cy="387" r="13" fill="#E9F7FF"/>
</svg>
